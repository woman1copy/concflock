[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woman1copy-concflock"
version = "0.1.0"
description = "在并发访问序列中找出会互相覆盖的写操作，标出冲突窗口"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "woman1copy" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://woman1copy.github.io"
Repository = "https://github.com/woman1copy/concflock"
Issues = "https://github.com/woman1copy/concflock/issues"

[project.scripts]
concflock = "concflock:main"

[tool.setuptools]
py-modules = ["concflock"]
